  <circle cx="120" cy="30" r="13" fill="#FFB38A" stroke="#2F5E1E" stroke-width="3"/>
  <circle cx="152" cy="41" r="11" fill="#FFB38A" stroke="#2F5E1E" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="120" cy="92" rx="70" ry="58" fill="#7ACB5A" stroke="#2F5E1E" stroke-width="3"/>
  <ellipse cx="80" cy="62" rx="13" ry="6" fill="#FFFFFF" opacity=".4" transform="rotate(-28 80 62)"/>
  <!-- blush -->
