  <circle cx="97" cy="105" r="2" fill="#FFFFFF"/>
  <circle cx="151" cy="105" r="2" fill="#FFFFFF"/>
  <!-- round glasses -->
  <circle cx="93" cy="98" r="20" fill="#FFFFFF" fill-opacity=".18" stroke="#8A4B2A" stroke-width="3"/>
  <circle cx="147" cy="98" r="20" fill="#FFFFFF" fill-opacity=".18" stroke="#8A4B2A" stroke-width="3"/>
  <path d="M113 95 Q120 88 127 95" fill="none" stroke="#8A4B2A" stroke-width="3" stroke-linecap="round"/>
