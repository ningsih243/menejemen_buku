    <path transform="translate(34 58)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z"/>
    <path transform="translate(208 50) scale(.8)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z"/>
    <path transform="translate(30 150) scale(.7)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z"/>
    <path transform="translate(212 138)" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z"/>
  </g>
  <!-- tail -->
  <path d="M152 196 C192 204 210 182 200 160 C196 176 182 182 158 176 Z" fill="#7ACB5A" stroke="#2F5E1E" stroke-width="3" stroke-linejoin="round"/>
