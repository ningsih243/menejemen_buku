  <path d="M120 162 L158 156 L158 192 L120 198 Z" fill="#FFFFFF" stroke="#8A4B2A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M90 166 L112 169.5 M90 175 L112 178.5 M90 184 L112 187.5" stroke="#D8C49B" stroke-width="2.5" stroke-linecap="round"/>
  <path transform="translate(139 176)" d="M0 5 C-9 -2 -6 -9 0 -4 C6 -9 9 -2 0 5 Z" fill="#FF8FA8"/>
  <path d="M78 194 L120 202 L162 194" fill="none" stroke="#E86F8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
