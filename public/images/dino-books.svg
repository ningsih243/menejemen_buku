  <circle cx="84" cy="178" r="8.5" fill="#7ACB5A" stroke="#2F5E1E" stroke-width="3"/>
  <circle cx="156" cy="178" r="8.5" fill="#7ACB5A" stroke="#2F5E1E" stroke-width="3"/>
